spring.application.name=Cafeteria_Ordering_Backend

# CORS allowed origins (defaults to local development, overridable via .env)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,https://*.trycloudflare.com}

# Cookie Security (false for local HTTP development, true for production HTTPS/Cloudflare)
app.security.cookie.secure=${APP_SECURITY_COOKIE_SECURE:false}

#Cloudflare
server.forward-headers-strategy=framework

#JWT Config
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=900000


# Database Connection (defaults to local MySQL, overridable via .env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cafeteriadb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Johannesburg}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Order Cleanup (pending items changed to cancelled after x amount of time)
    # How often the scheduler wakes up to check (in milliseconds - 5min currently)
app.scheduler.order-cleanup.delay-ms=300000
    # How old an order must be before it is considered expired (in minutes - 15min currently)
app.orders.expiration-timeout-minutes=15

# Cafeteria Operating Hours
app.cafeteria.opening-time=08:00
app.cafeteria.closing-time=17:30

# File Upload & Image Storage Configuration
app.image-storage.provider=cloudinary
app.upload.dir=${APP_UPLOAD_DIR:../uploads}
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Cloudinary Settings
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:api_secret}

# Multipart Upload File Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB